<script>
(function () {
    'use strict';
    document.addEventListener('DOMContentLoaded', function () {
        if (!document.body.classList.contains('sidebar-submit')) return;
        if (!document.body.classList.contains('change-form')) return;
        if (document.body.classList.contains('popup')) return;

        var contentMain = document.getElementById('content-main');
        if (!contentMain) return;

        var form = contentMain.querySelector('form');
        if (!form) return;

        var submitRows = form.querySelectorAll('.submit-row');
        if (!submitRows.length) return;

        // Create sidebar container
        var sidebar = document.createElement('div');
        sidebar.id = 'submit-sidebar';

        // Move first submit-row into sidebar and associate inputs with the form
        var submitRow = submitRows[0];
        var formId = form.id;
        submitRow.querySelectorAll('input[type="submit"]').forEach(function (input) {
            input.setAttribute('form', formId);
        });
        sidebar.appendChild(submitRow);

        // Remove remaining submit-rows (bottom duplicate)
        for (var i = submitRows.length - 1; i >= 1; i--) {
            submitRows[i].remove();
        }

        // Move object-tools (History, etc.) into sidebar
        var objectTools = contentMain.querySelector('.object-tools');
        if (objectTools) {
            sidebar.appendChild(objectTools);
        }

        contentMain.appendChild(sidebar);
    });
})();
</script>
