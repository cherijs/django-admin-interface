<script>
(function () {
    'use strict';
    document.addEventListener('DOMContentLoaded', function () {
        if (!document.body.classList.contains('sidebar-submit')) return;
        if (!document.body.classList.contains('change-form')) return;
        if (document.body.classList.contains('popup')) return;

        var contentMain = document.getElementById('content-main');
        if (!contentMain) return;

        var form = contentMain.querySelector('form');
        if (!form) return;

        var submitRows = form.querySelectorAll('.submit-row');
        if (!submitRows.length) return;

        var formId = form.id;
        var submitRow = submitRows[0];

        // Extract individual buttons from the submit row
        var savePrimary = submitRow.querySelector('input[name="_save"]');
        var saveContinue = submitRow.querySelector('input[name="_continue"]');
        var saveAddAnother = submitRow.querySelector('input[name="_addanother"]');
        var deleteBox = submitRow.querySelector('p.deletelink-box');
        var deleteLink = !deleteBox ? submitRow.querySelector('a.deletelink') : null;

        // Associate inputs with the form (they'll be moved outside <form>)
        [savePrimary, saveContinue, saveAddAnother].forEach(function (input) {
            if (input) input.setAttribute('form', formId);
        });

        // Remove all submit-rows from DOM
        for (var i = submitRows.length - 1; i >= 0; i--) {
            submitRows[i].remove();
        }

        var objectTools = contentMain.querySelector('.object-tools');

        // --- Build sidebar ---
        var sidebar = document.createElement('div');
        sidebar.id = 'submit-sidebar';

        // Actions card
        var actionsCard = document.createElement('div');
        actionsCard.className = 'submit-card submit-actions-card';

        var actionsBody = document.createElement('div');
        actionsBody.className = 'submit-card-body';

        [savePrimary, saveContinue, saveAddAnother].forEach(function (btn) {
            if (btn) actionsBody.appendChild(btn);
        });

        if (deleteBox) {
            actionsBody.appendChild(deleteBox);
        } else if (deleteLink) {
            actionsBody.appendChild(deleteLink);
        }

        // Tools section (separated by border)
        if (objectTools) {
            var toolsBody = document.createElement('div');
            toolsBody.className = 'submit-card-body submit-tools-section';
            toolsBody.appendChild(objectTools);
            actionsCard.appendChild(actionsBody);
            actionsCard.appendChild(toolsBody);
        } else {
            actionsCard.appendChild(actionsBody);
        }
        sidebar.appendChild(actionsCard);

        contentMain.appendChild(sidebar);
    });
})();
</script>
